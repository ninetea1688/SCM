# Kong Gateway host (e.g. scm.officesoft.shop behind a shared Kong in Docker).
# Cloudflare terminates TLS; the shared Kong (network `kong-docker_default`) routes to the
# stack via the unique aliases below — replaces the bundled Caddy. Register the Kong
# services/routes once per host with docker/scripts/kong-routes.sh.
#
# NEVER point Kong at the bare service names (`api`, `web`, `s3`): on a shared gateway
# network those aliases collide with other projects' containers (Docker DNS round-robins
# them). The explicit `scm-*` aliases are unique — that is what kong-routes.sh uses.
#
# Usage:
#   docker compose -f docker-compose.prod.yml -f docker-compose.kong.yml \
#     --env-file .env.prod up -d --build --scale caddy=0
services:
  web:
    # The image bakes API_INTERNAL_URL=http://api:4000 — on a shared gateway network the
    # bare `api` name is ambiguous (other projects' containers), so the BFF must use the
    # unique alias that exists on BOTH networks (see api.networks below).
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://scm-api:4000
    networks:
      default: {}
      kong: { aliases: [scm-web] }
  api:
    networks:
      default: { aliases: [scm-api] }
      kong: { aliases: [scm-api] }
  s3:
    networks:
      default: {}
      kong: { aliases: [scm-s3] }

networks:
  default: {}
  kong:
    name: kong-docker_default
    external: true
